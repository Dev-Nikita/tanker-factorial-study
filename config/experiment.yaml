# Three-factor, three-level full factorial design (3^3 = 27), SRC-B.

factors:
  x1:
    name: front_fill
    symbol: lambda_1
    unit: "-"
    levels: {"-1": 0.0, "0": 0.5, "+1": 1.0}
    description: "Filling level of the front (leading) tank"
  x2:
    name: rear_fill
    symbol: lambda_2
    unit: "-"
    levels: {"-1": 0.0, "0": 0.5, "+1": 1.0}
    description: "Filling level of the rear (trailing) tank"
  x3:
    name: speed_factor
    symbol: v_t
    unit: "m/s"
    levels: {"-1": 4.0, "0": 4.5, "+1": 5.0}
    description: >
      SRC-B calls this "швидкість рушання" (start-off speed). Its exact physical
      definition is NOT established in the sources. In this implementation it is
      the TARGET SPEED of the start-off manoeuvre: the vehicle starts from rest and
      the response window closes when this speed is first reached. See
      docs/MISSING_INPUTS.md item M-01.

coding:
  x1: "(lambda_1 - 0.5) / 0.5"
  x2: "(lambda_2 - 0.5) / 0.5"
  x3: "(v_t - 4.5) / 0.5"

scenarios:
  start_off:
    t_span_s: [0.0, 60.0]
    v0_m_s: 0.0
    terminate_on_target_speed: true
  braking:
    # Applied after the full acceleration stage of SRC-A
    t_brake_start_s: 600.0
    t_span_s: [600.0, 720.0]

randomisation:
  seed: 42

replication:
  computational: 1        # deterministic ODE -> replicates are meaningless
  physical_recommended: 3 # 27 x 3 = 81 runs
  physical_minimum_centre_points: 5

configurations:
  - rigid
  - compliant
scales:
  - full_scale
  - rig_scale
